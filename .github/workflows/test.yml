name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build MCP adapter test artifacts
        run: npm run build:public --workspace pi-mcp-adapter
      - name: Build MCP adapter visualizer example
        run: |
          npm install --prefix packages/pi-mcp-adapter/examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run build --prefix packages/pi-mcp-adapter/examples/interactive-visualizer
      - run: npm run typecheck
      - run: npm test

  pi-tool-display:
    name: pi-tool-display
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/pi-tool-display/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: packages/pi-tool-display
      - run: npm run check
        working-directory: packages/pi-tool-display
